version: 1
frame:
  # Vehicle frame: x forward, y left, z up. Lengths are metres.
  ego_axes: {x: forward, y: left, z: up}
  origin: vehicle_center_projected_to_ground
  unit_length: m
  unit_angle: deg
rotation:
  convention: yaw_pitch_roll
  # yaw positive left, pitch positive up, roll positive clockwise in the image
  order: yaw_pitch_roll
image_hw: [2464, 2048]

